{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Productive+</title>

  <!-- Bootstrap 5 (global CDN link) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom CSS -->

<link rel="stylesheet" href="{% static 'css/global.css' %}">

</head>
<body>
  <div class="dashboard-wrapper">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
      <a href="index.html" class="sidebar-logo">Productive<span class="accent">+</span></a>

      <nav class="sidebar-nav">
        <a href="#" class="sidebar-link active">
          <span class="sidebar-icon"><i class="bi bi-grid-1x2-fill"></i></span>
          Overview
        </a>
        <a href="#" class="sidebar-link">
          <span class="sidebar-icon"><i class="bi bi-check2-square"></i></span>
          My Tasks
        </a>
        <a href="#" class="sidebar-link">
          <span class="sidebar-icon"><i class="bi bi-calendar3"></i></span>
          Calendar
        </a>
        <a href="#" class="sidebar-link">
          <span class="sidebar-icon"><i class="bi bi-tags-fill"></i></span>
          Categories
        </a>
        <a href="#" class="sidebar-link">
          <span class="sidebar-icon"><i class="bi bi-gear-fill"></i></span>
          Settings
        </a>
        <a href="#" class="sidebar-link">
          <span class="sidebar-icon"><i class="bi bi-robot"></i></span>
          Ai Bot
        </a>
      </nav>
    </aside>

    <!-- ===== MAIN AREA ===== -->
    <div class="main-area">

      <!-- ===== TOPBAR ===== -->
      <header class="topbar">
        <button class="topbar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <i class="bi bi-list"></i>
        </button>

        <div class="topbar-search">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Search tasks........" aria-label="Search tasks">
        </div>

        <div class="topbar-actions">
          <a href="#" class="icon-pill" title="Notifications"><i class="bi bi-bell-fill"></i></a>
          <a href="#" class="icon-pill" title="AI Assistant"><i class="bi bi-stars"></i></a>
          <a href="#" class="user-pill">
            <span class="user-avatar">AJ</span>
            <span class="user-name d-none d-md-inline">Akshara Jethava</span>
          </a>
        </div>
      </header>

{% block start %}

{% endblock %}

<!-- ===== FOOTER ===== -->
        <footer class="dashboard-footer">
          <a href="index.html" class="sidebar-logo footer-logo">Productive<span class="accent">+</span></a>
          <p class="mb-0">© 2025 Productive+. All rights reserved.</p>
          <div class="footer-links d-flex gap-4">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Contact</a>
          </div>
        </footer>
      
    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js for the productivity chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <!-- Custom JS -->
  <script src="{% static 'js/dashboard.js' %}"></script>
</body>
</html>
