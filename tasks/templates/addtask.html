{% extends "base.html "%}
{% load static %}

{% block start%}
<link rel="stylesheet" href="{% static 'css/addtask.css' %}">
<!-- ===== CONTENT ===== -->
      <main class="content content-narrow">

        <div class="panel task-form-panel">

          <div class="d-flex align-items-center gap-3 mb-1">
            <a href="dashboard.html" class="back-arrow" aria-label="Go back"><i class="bi bi-arrow-left"></i></a>
            <h1 class="form-title mb-0">Add New Task</h1>
          </div>
          <p class="form-subtitle">Keep track and achieve more by adding your tasks.</p>

          <form id="addTaskForm" novalidate>

            <!-- Task Title -->
            <div class="form-block">
              <label for="taskTitle" class="form-block-label">Task Title</label>
              <input type="text" class="form-control custom-input" id="taskTitle" placeholder="eg. complete python project" required>
            </div>

            <!-- Description -->
            <div class="form-block">
              <label for="taskDescription" class="form-block-label">
                Description <span class="optional-tag">(optional)</span>
              </label>
              <textarea class="form-control custom-input" id="taskDescription" rows="4" placeholder="Add more details about your task......"></textarea>
            </div>

            <!-- Category + Priority -->
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <div class="form-block h-100">
                  <label for="taskCategory" class="form-block-label">Category</label>
                  <select class="form-select custom-input" id="taskCategory">
                    <option value="" selected disabled>Select Category</option>
                    <option value="work">Work</option>
                    <option value="study">Study</option>
                    <option value="design">Design</option>
                    <option value="projects">Projects</option>
                    <option value="personal">Personal</option>
                  </select>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="form-block h-100">
                  <label for="taskPriority" class="form-block-label">Priority</label>
                  <select class="form-select custom-input" id="taskPriority">
                    <option value="" selected disabled>Select Priority</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Tags -->
            <div class="form-block">
              <label for="tagInput" class="form-block-label">
                Tags <span class="optional-tag">(optional)</span>
              </label>
              <input type="text" class="form-control custom-input" id="tagInput" placeholder="Add tags and press enter......">
              <div class="tag-chip-wrap" id="tagChipWrap">
                <span class="tag-chip tag-chip-yellow">Study <button type="button" class="chip-remove" aria-label="Remove tag">×</button></span>
                <span class="tag-chip tag-chip-pink">Python <button type="button" class="chip-remove" aria-label="Remove tag">×</button></span>
                <span class="tag-chip tag-chip-purple">Design <button type="button" class="chip-remove" aria-label="Remove tag">×</button></span>
              </div>
            </div>

            <!-- Remind Me -->
            <div class="form-block">
              <div class="d-flex justify-content-between align-items-center">
                <label class="form-block-label mb-0" for="remindToggle">Remind Me</label>
                <label class="switch">
                  <input type="checkbox" id="remindToggle" checked>
                  <span class="switch-slider"></span>
                </label>
              </div>
              <select class="form-select custom-input mt-3" id="reminderTime">
                <option value="10">10 Min Before</option>
                <option value="30" selected>30 Min Before</option>
                <option value="60">1 Hour Before</option>
                <option value="1440">1 Day Before</option>
              </select>
            </div>

            <!-- Task Color -->
            <div class="form-block">
              <label class="form-block-label">Task Color</label>
              <p class="form-block-hint">Choose task color for task</p>
              <div class="color-swatch-wrap" id="colorSwatchWrap">
                <button type="button" class="color-swatch selected" style="background-color:#c084fc" data-color="#c084fc" aria-label="Purple"></button>
                <button type="button" class="color-swatch" style="background-color:#fde047" data-color="#fde047" aria-label="Yellow"></button>
                <button type="button" class="color-swatch" style="background-color:#86efac" data-color="#86efac" aria-label="Green"></button>
                <button type="button" class="color-swatch" style="background-color:#60a5fa" data-color="#60a5fa" aria-label="Blue"></button>
                <button type="button" class="color-swatch" style="background-color:#f472b6" data-color="#f472b6" aria-label="Pink"></button>
                <button type="button" class="color-swatch" style="background-color:#f87171" data-color="#f87171" aria-label="Red"></button>
              </div>
            </div>

            <!-- Pin / Favorite -->
            <div class="form-block">
              <div class="d-flex justify-content-between align-items-center">
                <label class="form-block-label mb-0" for="pinToggle">Pin / Favorite</label>
                <label class="switch">
                  <input type="checkbox" id="pinToggle">
                  <span class="switch-slider"></span>
                </label>
              </div>
            </div>

            <!-- Actions -->
            <div class="row g-3 mt-1">
              <div class="col-12 col-sm-6">
                <button type="button" class="btn btn-cancel-task w-100" id="cancelTaskBtn">Cancel Task</button>
              </div>
              <div class="col-12 col-sm-6">
                <button type="submit" class="btn btn-save-task w-100">Save Task</button>
              </div>
            </div>

          </form>
        </div>

      </main>
    </div>
  </div>

{% endblock %}
