<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

     <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&family=Inria+Serif:wght@400;700&family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet">

   <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="{% static 'css/auth.css' %}">

    <title>{{page}}</title>
</head>
<body class="auth-page">


  <div class="auth-wrapper">

   
       <a href="index.html" class="auth-logo">
      <span class="auth-logo-badge"><i class="bi bi-c-circle-fill"></i></span>
      Productive<span class="accent">+</span>
    </a>

<h1 class="auth-title">Create your account</h1>
 <div class="auth-card">
      <form id="authForm"  method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="auth-field">
          <label for="fullName" class="auth-label">Full name</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon"><i class="bi bi-person-fill"></i></span>
            <input type="text" class="auth-input" id="fullName" placeholder="Enter Name" name="name" required>
          </div>
        </div>

        <div class="auth-field">
    <label for="authNumber" class="auth-label">Phone Number</label>

    <div class="auth-input-wrap">
        <span class="auth-input-icon">
            <i class="bi bi-telephone-fill"></i>
        </span>

        <input
            type="text"
            class="auth-input"
            id="authNumber"
            placeholder="Enter phone number"
            name="number"
            required>
    </div>
</div>

        <div class="auth-field">
          <label for="authEmail" class="auth-label">Email</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon"><i class="bi bi-envelope-fill"></i></span>
            <input type="email" class="auth-input" id="authEmail" placeholder="Enter email" name="email" required>
          </div>
        </div>

        <div class="auth-field">
          <label for="authPassword" class="auth-label">Password</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="auth-input" id="authPassword" placeholder="Enter password" name="password" required minlength="8">
            <button type="button" class="auth-toggle-visibility" data-target="authPassword" aria-label="Show password">
              <i class="bi bi-eye-fill"></i>
            </button>
          </div>
        </div>

      <div class="auth-field">
    <label for="confirmPassword" class="auth-label">
        Confirm Password
    </label>

    <div class="auth-input-wrap">
        <span class="auth-input-icon">
            <i class="bi bi-lock-fill"></i>
        </span>

        <input
            type="password"
            class="auth-input"
            id="confirmPassword"
            placeholder="Enter Confirm password"
            name="c_password"
            required
            minlength="8">

        <button
            type="button"
            class="auth-toggle-visibility"
            data-target="confirmPassword"
            aria-label="Show password">

            <i class="bi bi-eye-fill"></i>
        </button>
    </div>
</div>

        
        <div class="auth-checkbox-row">
          <label class="auth-checkbox">
            <input type="checkbox" id="agreeTerms" name="terms" required>
            <span class="auth-checkmark"><i class="bi bi-check-lg"></i></span>
          </label>
          <label for="agreeTerms" class="auth-checkbox-label">
            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="auth-submit-btn">Create account</button>
      </form>
    </div>

    <p class="auth-switch-text">Already have an account? <a href="signin.html">Sign in</a></p>

  </div>

   <!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Shared auth JS 
<script src="{% static 'js/auth.js' %}"></script> -->
</body>
</html>
