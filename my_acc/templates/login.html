{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Productive+</title>

  <!-- Bootstrap 5 (global CDN link) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&family=Inria+Serif:wght@400;700&family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth-page">

  <div class="auth-wrapper">

    <a href="index.html" class="auth-logo">
      <span class="auth-logo-badge"><i class="bi bi-c-circle-fill"></i></span>
      Productive<span class="accent">+</span>
    </a>

    <h1 class="auth-title">Welcome back!</h1>
    <p class="auth-subtitle">Sign in to continue to Productive+</p>

    <div class="auth-card">
      <form id="authForm" novalidate method="POST" enctype="multipart/form-data">
        {% csrf_token %}
         {% if messages %}
        <div class="alert alert-info">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %} 
        <div class="auth-field">
          <label for="authEmail" class="auth-label">Username</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon"><i class="bi bi-envelope-fill"></i></span>
            <input type="text" class="auth-input" id="authEmail" name="u_name" placeholder="Enter username" required>
          </div>
        </div>

        <div class="auth-field">
          <label for="authPassword" class="auth-label">Password</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="auth-input" id="authPassword" name="password" placeholder="Enter password" required>
            <button type="button" class="auth-toggle-visibility" data-target="authPassword" aria-label="Show password">
              <i class="bi bi-eye-fill"></i>
            </button>
          </div>
          <a href="#" class="auth-forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="auth-submit-btn">Sign in</button>
      </form>
    </div>

    <p class="auth-switch-text">Don't have an account? <a href="{% url 'register' %}">Sign up</a></p>

  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom auth JS -->
  <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
